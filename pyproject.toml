[project]
name = "codisplan-nfse"
version = "0.1.2"
description = "API e aplicativo Windows para NFS-e Nacional (ADN) e relatorios fiscais"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn>=0.34,<1.0", "httpx>=0.27,<1.0",
  "cryptography>=43,<48", "python-multipart>=0.0.9,<1.0", "defusedxml>=0.7,<1.0",
  "openpyxl>=3.1,<4.0", "reportlab>=4.2,<5.0"
]
[project.optional-dependencies]
windows = ["PySide6>=6.8,<7.0","PySide6-WebEngine>=6.8,<7.0","pywin32>=308","pyinstaller>=6.10,<7.0"]
test = ["pytest>=8","httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
