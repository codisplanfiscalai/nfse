[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codisplan-nfse"
version = "0.3.0"
description = "API ADN e relatorios fiscais com painel Vue e Windows GUI"
requires-python = ">=3.10"
dependencies = [
 "fastapi==0.128.2",
 "uvicorn==0.48.0",
 "httpx==0.28.1",
 "cryptography==46.0.4",
 "defusedxml==0.7.1",
 "reportlab==4.4.9",
 "openpyxl==3.1.5",
 "pillow==13.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
