name: Windows GUI build
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
permissions:
  contents: read
jobs:
  windows:
    name: Windows GUI ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.17'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Locate dependency caches
        id: paths
        shell: pwsh
        run: |
          "pip=$(python -m pip cache dir)" >> $env:GITHUB_OUTPUT
          "npm=$(npm config get cache)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ steps.paths.outputs.pip }}
            ${{ steps.paths.outputs.npm }}
          key: codisplan-nfse-windows-${{ matrix.arch }}-deps-${{ hashFiles('requirements-server.txt', 'packaging/requirements-build.txt') }}
      - name: Build graphical executable and run native smoke
        env:
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: python scripts/build.py windows --arch "$env:BUILD_ARCH" --version "$env:BUILD_VERSION" --install-build-tools
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
  verify:
    name: Verify downloaded Windows packages
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: windows-*
          path: verified-distributions
          merge-multiple: true
      - env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python packaging/verify_artifacts.py verified-distributions --source-sha "$SOURCE_SHA"
