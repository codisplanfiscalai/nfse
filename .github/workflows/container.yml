name: Container build
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Test, build and export the exact tested image
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: python scripts/build.py container --version "$BUILD_VERSION"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: container
          path: artifacts/container.*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
