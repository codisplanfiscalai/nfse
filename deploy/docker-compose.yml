services:
  codisplan-nfse:
    build:
      context: ..
      target: final
    image: codisplan-nfse:local
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      NFSE_DATA_DIR: /var/lib/codisplan-nfse
    volumes:
      - nfse-data:/var/lib/codisplan-nfse
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
volumes:
  nfse-data:
