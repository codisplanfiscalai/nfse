<div class="shell" :class="{signed:user}">
  <template v-if="!user">
    <div class="auth-layout">
      <aside class="auth-side"><div class="auth-brand"><img src="/static/app.png" alt="" class="auth-icon"><span>Codisplan <strong>NFS-e</strong></span></div>
        <div class="auth-message"><p class="eyebrow light">PLATAFORMA FISCAL</p><h1>Documentos e relatórios. Em um só lugar.</h1>
          <p>Sincronize documentos pelo Ambiente de Dados Nacional, acompanhe eventos e transforme XMLs em relatórios confiáveis.</p>
          <div class="auth-features"><span>◈ Integração com certificado digital</span><span>◈ Histórico fiscal rastreável</span><span>◈ Relatórios por competência</span></div>
        </div><div class="auth-bottom">CODISPLAN · TECNOLOGIA PARA CONTABILIDADE</div>
      </aside>
      <main class="auth-main"><section class="auth-card"><img src="/static/logo.jpg" alt="Codisplan Contabilidade" class="login-logo"><p class="eyebrow">ACESSO SEGURO</p>
        <h2>{{configured?'Entrar no painel':'Configurar administrador'}}</h2><p class="muted">{{configured?'Use suas credenciais de acesso à plataforma.':'Primeiro acesso: crie o administrador local.'}}</p>
        <form @submit.prevent="submitAuth" class="stack"><label v-if="!configured" class="field">Nome completo<input v-model="login.name" required autocomplete="name"></label>
          <label class="field">E-mail<input v-model="login.email" type="email" required autocomplete="username"></label>
          <label class="field">Senha<input v-model="login.password" type="password" required :minlength="configured?1:12" autocomplete="current-password"></label>
          <p v-if="!configured" class="field-help">Use pelo menos 12 caracteres. A senha não será registrada em texto puro.</p>
          <div v-if="error" class="alert danger">{{error}}</div><button class="btn primary wide" :disabled="busy">{{busy?'Processando...':configured?'Entrar':'Criar administrador'}}</button>
        </form><div class="login-footer">Acesso protegido · Conexão local · Credenciais criptografadas</div></section></main>
    </div>
  </template>
  <template v-else>
    <div v-if="menuOpen" class="mobile-scrim" @click="menuOpen=false"></div>
    <aside class="sidebar" :class="{'open':menuOpen}">
      <div class="sidebar-header"><img src="/static/app.png" alt="" class="brand-icon"><div><strong>Codisplan</strong><span>NFS-e • Administração</span></div><button class="mobile-close" @click="menuOpen=false" aria-label="Fechar menu">×</button></div>
      <div class="workspace-tag"><span class="status-dot"></span> Ambiente administrativo <span class="workspace-version">{{version}}</span></div>
      <nav class="nav" aria-label="Navegação principal"><div v-for="group in menuGroups" :key="group.title" class="menu-section"><div class="menu-title">{{group.title}}</div>
        <button v-for="item in group.items" :key="item.id" type="button" class="nav-item" :class="{active:page===item.id}" @click="go(item.id)"><span class="nav-icon">{{item.icon}}</span><span>{{item.label}}</span><span v-if="page===item.id" class="nav-caret">›</span></button>
      </div></nav><div class="sidebar-bottom"><div class="profile-bubble">{{initials}}</div><div class="profile-text"><strong>{{user.name}}</strong><span>{{user.role}}</span></div><button title="Sair" class="logout" @click="logout">⇥</button></div>
    </aside>
    <div class="app-main">
      <header class="topbar"><button class="hamburger" @click="menuOpen=true" aria-label="Abrir menu">☰</button>
        <div class="breadcrumb">GESTÃO FISCAL <span>/</span> {{pageLabel}}</div><div class="top-actions"><span class="status-pill"><span class="status-dot"></span> Sistema local</span><button class="avatar" @click="go('profile')" :title="user.name">{{initials}}</button></div></header>
      <main class="content"><div class="page-intro"><div><p class="eyebrow">CODISPLAN NFS-e</p><h1>{{pageLabel}}</h1><p class="muted">{{pageSubtitle}}</p></div><div class="intro-action"><button v-if="page==='dashboard'" class="btn primary" @click="go('reports')">Gerar relatório <span>↗</span></button><button v-if="page==='companies'" class="btn primary" @click="showCompany=true">+ Nova empresa</button></div></div>
      <div v-if="error" class="alert danger" role="alert">{{error}} <button @click="error=''">×</button></div><div v-if="notice" class="alert success">{{notice}} <button @click="notice=''">×</button></div>
      <section v-if="page==='dashboard'">
        <div class="metrics"><div v-for="metric in metrics" :key="metric.key" class="metric"><div class="metric-icon">{{metric.icon}}</div><div class="metric-label">{{metric.label}}</div><div class="metric-value">{{dashboard[metric.key]||0}}</div><div class="metric-desc">{{metric.desc}}</div></div></div>
        <div class="dashboard-grid"><div class="panel"><div class="panel-header"><div><p class="eyebrow">ATIVIDADE</p><h2>Sincronizações recentes</h2></div><button class="link-button" @click="go('sync')">Ver todas →</button></div>
          <div v-if="!dashboard.latest?.length" class="empty">Nenhuma sincronização registrada. Cadastre uma empresa e seu certificado para começar.</div>
          <div v-else class="table-wrap"><table><thead><tr><th>Empresa</th><th>Início</th><th>Documentos</th><th>Situação</th></tr></thead><tbody><tr v-for="item in dashboard.latest" :key="item.id"><td>{{item.company}}</td><td>{{datetime(item.started_at)}}</td><td>{{item.inserted}} / {{item.fetched}}</td><td><span class="mini-badge" :class="item.status==='CONCLUIDA'?'good':'warn'">{{item.status}}</span></td></tr></tbody></table></div></div>
          <div class="panel tips"><div class="panel-header"><h2>Próximas etapas</h2></div><div class="tip" @click="go('companies')"><span class="tip-num">01</span><div><strong>Organize as empresas</strong><p>Cadastre os contribuintes e seus vínculos.</p></div><span>›</span></div><div class="tip" @click="go('certificates')"><span class="tip-num">02</span><div><strong>Configure o certificado</strong><p>Associe um certificado digital A1 autorizado.</p></div><span>›</span></div><div class="tip" @click="go('reports')"><span class="tip-num">03</span><div><strong>Emita relatórios</strong><p>Selecione o período e exporte PDF ou Excel.</p></div><span>›</span></div></div></div>
      </section>
      <section v-else-if="page==='companies'" class="panel"><div class="panel-header"><div><h2>Empresas cadastradas</h2><p class="muted">CNPJ ou CPF autorizado para a consulta de documentos fiscais.</p></div></div>
        <div class="table-wrap"><table><thead><tr><th>Razão social</th><th>Inscrição</th><th>Situação</th><th></th></tr></thead><tbody><tr v-for="c in companies" :key="c.id"><td><strong>{{c.name}}</strong></td><td class="mono">{{c.identifier}}</td><td><span class="mini-badge good">{{c.active?'Ativa':'Inativa'}}</span></td><td><button class="link-button" @click="report.company_id=c.id;go('reports')">Relatórios →</button></td></tr></tbody></table></div><div v-if="!companies.length" class="empty">Nenhuma empresa cadastrada.</div></section>
      <section v-else-if="page==='certificates'"><div class="panel padded"><div class="panel-header"><div><h2>Certificados digitais A1</h2><p class="muted">Utilizados no canal mTLS oficial do ADN.</p></div></div>
        <form class="form-grid" @submit.prevent="uploadCertificate"><label class="field">Identificação<input v-model="certificate.label" placeholder="Contador / Empresa" required></label><label class="field">Arquivo PFX/P12<input type="file" accept=".pfx,.p12" @change="readCertificate" required></label><label class="field">Senha do certificado<input type="password" v-model="certificate.password" autocomplete="off" required></label><button class="btn primary" :disabled="busy">Adicionar certificado</button></form><p class="field-help">O arquivo fica criptografado no armazenamento local. Não o envie por e-mail nem o inclua no repositório.</p></div>
        <div class="panel spaced"><div class="panel-header"><h2>Certificados cadastrados</h2></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Titular</th><th>Validade</th></tr></thead><tbody><tr v-for="c in certificates" :key="c.id"><td>{{c.label}}</td><td>{{c.identity}}</td><td>{{datetime(c.expires_at)}}</td></tr></tbody></table></div><div v-if="!certificates.length" class="empty">Nenhum certificado cadastrado.</div></div>
        <div class="panel padded spaced"><h2>Autorizar certificado para empresa</h2><form @submit.prevent="linkCertificate" class="form-grid"><label class="field">Empresa<select v-model.number="link.company_id" required><option disabled value="">Selecione...</option><option v-for="c in companies" :value="c.id">{{c.name}}</option></select></label><label class="field">Certificado<select v-model.number="link.certificate_id" required><option disabled value="">Selecione...</option><option v-for="c in certificates" :value="c.id">{{c.label}}</option></select></label><button class="btn primary" :disabled="busy">Vincular</button></form></div>
      </section>
      <section v-else-if="page==='sync'"><div class="panel padded"><div class="panel-header"><div><h2>Distribuição de documentos</h2><p class="muted">Sincronização sequencial a partir do último NSU registrado.</p></div></div><form @submit.prevent="startSync" class="form-grid"><label class="field">Empresa<select v-model.number="syncForm.company_id" required><option disabled value="">Selecione...</option><option v-for="c in companies" :value="c.id">{{c.name}}</option></select></label><label class="field">Certificado autorizado<select v-model.number="syncForm.certificate_id" required><option disabled value="">Selecione...</option><option v-for="c in certificates" :value="c.id">{{c.label}}</option></select></label><button class="btn primary" :disabled="busy">Iniciar sincronização</button></form><p class="field-help">O NSU é exclusivo: notas do período são filtradas após armazenamento. Nenhuma competência é presumida como integralmente conferida.</p></div>
        <div class="panel padded spaced"><div class="panel-header"><div><h2>Consultas diretas ao ADN</h2><p class="muted">Consulte um NSU específico, um lote ou os eventos vinculados a uma chave de acesso.</p></div></div>
         <div class="form-grid"><label class="field">NSU inicial<input type="number" min="0" v-model.number="direct.nsu"></label><label class="field">Modo<select v-model="direct.lote"><option :value="true">Lote a partir do NSU (exclusivo)</option><option :value="false">Documento específico por NSU</option></select></label><label class="field">Chave de acesso NFS-e<input v-model="direct.access_key" placeholder="Informe a chave para consultar eventos"></label><label class="field">Persistir XMLs encontrados<select v-model="direct.save"><option :value="false">Não, somente conferir</option><option :value="true">Sim, sem avançar cursor</option></select></label></div>
         <div class="actions spaced"><button class="btn secondary" @click="directQuery('nsu')" :disabled="busy">Consultar por NSU</button><button class="btn secondary" @click="directQuery('events')" :disabled="busy">Consultar eventos da chave</button></div>
         <div v-if="directResult" class="spaced"><p><strong>Resultado:</strong> {{directResult.StatusProcessamento||directResult.status||'Localizado'}} • {{directResult.documentos?.length||0}} documentos • {{directResult.salvos||0}} novos armazenados</p><div class="table-wrap"><table><thead><tr><th>NSU</th><th>Chave de acesso</th><th>Documento</th><th>Evento</th></tr></thead><tbody><tr v-for="(d,i) in directResult.documentos" :key="i"><td>{{d.NSU}}</td><td class="mono">{{d.ChaveAcesso}}</td><td>{{d.TipoDocumento}}</td><td>{{d.TipoEvento||'—'}}</td></tr></tbody></table></div></div>
        </div>
        <div class="panel spaced"><div class="panel-header"><h2>Execuções</h2><button class="btn secondary small" @click="load('sync')">Atualizar</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Início</th><th>Localizados</th><th>Novos</th><th>Resultado</th><th>Diagnóstico</th></tr></thead><tbody><tr v-for="x in runs" :key="x.id"><td>{{x.id}}</td><td>{{datetime(x.started_at)}}</td><td>{{x.fetched}}</td><td>{{x.inserted}}</td><td>{{x.status}}</td><td>{{x.diagnostic||'—'}}</td></tr></tbody></table></div></div>
      </section>
      <section v-else-if="page==='documents'"><div class="panel padded"><div class="panel-header"><h2>Documentos e eventos</h2></div><div class="filters"><label class="field">Empresa<select v-model.number="filter.company_id"><option disabled value="">Selecione...</option><option v-for="c in companies" :value="c.id">{{c.name}}</option></select></label><label class="field">Tipo<select v-model="filter.document_type"><option value="">Todos</option><option>NFSE</option><option>EVENTO</option><option>DPS</option><option>CNC</option></select></label><button class="btn primary" @click="loadDocuments">Consultar</button></div><div class="table-wrap"><table><thead><tr><th>NSU</th><th>Nota</th><th>Data</th><th>Tomador</th><th>Tipo</th><th>Situação</th><th>XML</th></tr></thead><tbody><tr v-for="d in documents" :key="d.id"><td class="mono">{{d.nsu}}</td><td>{{d.invoice_number||'—'}}</td><td>{{d.issued_on||'—'}}</td><td>{{d.recipient_name||'—'}}</td><td>{{d.document_type}}</td><td>{{d.status}}</td><td><a :href="'/api/v1/documents/'+d.id+'/xml'" target="_blank">Baixar</a></td></tr></tbody></table></div><div v-if="!documents.length" class="empty">Selecione a empresa e clique em Consultar.</div></div></section>
      <section v-else-if="page==='reports'"><div class="panel padded"><div class="panel-header"><div><h2>Gerar demonstrativo fiscal</h2><p class="muted">Valores provenientes dos XMLs recebidos e armazenados.</p></div></div>
        <form class="report-controls" @submit.prevent="previewReport"><label class="field">Empresa<select v-model.number="report.company_id" required><option disabled value="">Selecione uma empresa</option><option v-for="c in companies" :value="c.id">{{c.name}}</option></select></label><label class="field">Tipo de relatório<select v-model="report.kind"><option value="mensal">Serviços prestados — emissão</option><option value="competencia">Serviços prestados — competência</option><option value="iss-retido">ISS retido</option><option value="canceladas">Canceladas e substituídas</option></select></label><label class="field">Data inicial<input v-model="report.inicio" type="date" required></label><label class="field">Data final<input v-model="report.fim" type="date" required></label><button class="btn primary" :disabled="busy">Visualizar</button></form>
        <div v-if="reportResult"><div class="summary-row"><div><span>Notas no período</span><strong>{{reportResult.count}}</strong></div><div><span>Serviços vigentes</span><strong>{{currency(reportResult.totals.service_cents)}}</strong></div><div><span>ISS retido</span><strong>{{currency(reportResult.totals.iss_withheld_cents)}}</strong></div><div><span>Canceladas</span><strong>{{reportResult.by_status.CANCELADA}}</strong></div></div>
        <div class="actions spaced"><button class="btn primary" @click="download('pdf')">↓ PDF</button><button class="btn secondary" @click="download('xlsx')">↓ Excel</button><button class="btn secondary" @click="download('csv')">↓ CSV</button></div>
        <div class="table-wrap"><table><thead><tr><th>Nota</th><th>Emissão</th><th>Competência</th><th>Tomador</th><th>Serviços</th><th>ISS retido</th><th>Situação</th></tr></thead><tbody><tr v-for="(d,i) in reportResult.rows.slice(0,150)" :key="i"><td>{{d.invoice_number}}</td><td>{{d.issued_on}}</td><td>{{d.competence_on}}</td><td>{{d.recipient_name}}</td><td>{{currency(d.service_cents)}}</td><td>{{currency(d.iss_withheld_cents)}}</td><td>{{d.status}}</td></tr></tbody></table></div><p class="field-help">{{reportResult.warning}} A visualização mostra até 150 linhas; a exportação inclui todas.</p></div>
      </div></section>
      <section v-else-if="page==='settings'" class="panel padded"><div class="panel-header"><h2>Integração com o ADN</h2></div><form @submit.prevent="saveSettings" class="stack"><label class="field">URL HTTPS oficial<input v-model="settings.adn_url" type="url" placeholder="https://...nfse.gov.br/..." required></label><p class="field-help">O endereço de produção deve ser fornecido pela documentação oficial. A aplicação não aceita endereços HTTP ou domínios de terceiros.</p><button class="btn primary" :disabled="busy">Salvar configuração</button></form></section>
      <section v-else-if="page==='users'" class="panel padded"><div class="panel-header"><h2>Usuários e acessos</h2></div><form class="form-grid" @submit.prevent="createUser"><label class="field">Nome<input v-model="userForm.name" required></label><label class="field">E-mail<input type="email" v-model="userForm.email" required></label><label class="field">Perfil<select v-model="userForm.role"><option value="admin">Administrador</option><option value="operador">Operador</option><option value="leitor">Leitor</option></select></label><label class="field">Senha inicial<input type="password" minlength="12" v-model="userForm.password" required></label><button class="btn primary" :disabled="busy">Cadastrar usuário</button></form><div class="table-wrap spaced"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th></tr></thead><tbody><tr v-for="x in users" :key="x.id"><td>{{x.name}}</td><td>{{x.email}}</td><td>{{x.role}}</td></tr></tbody></table></div></section>
      <section v-else-if="page==='audit'" class="panel padded"><div class="panel-header"><h2>Histórico de ações</h2></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Ator</th><th>Ação</th><th>Objeto</th></tr></thead><tbody><tr v-for="x in audit" :key="x.id"><td>{{datetime(x.at)}}</td><td>{{x.actor}}</td><td>{{x.action}}</td><td>{{x.target}}</td></tr></tbody></table></div></section>
      <section v-else-if="page==='profile'" class="panel padded"><h2>Minha conta</h2><p><strong>{{user.name}}</strong></p><p>{{user.email}}</p><p>Perfil: {{user.role}}</p><p class="muted">Sessão local com cookie HttpOnly e proteção CSRF.</p><button class="btn secondary" @click="logout">Encerrar sessão</button></section>
      <footer class="footer"><span>Codisplan Contabilidade · Plataforma NFS-e</span><span>{{version}} · {{user.role}}</span></footer>
      </main>
    </div>
  </template>
  <div v-if="showCompany" class="modal-shade" @click.self="showCompany=false"><section class="modal" role="dialog" aria-modal="true"><div class="panel-header"><h2>Nova empresa</h2><button class="close" @click="showCompany=false" aria-label="Fechar">×</button></div><form @submit.prevent="addCompany" class="stack padded"><label class="field">Razão social<input v-model="companyForm.name" required></label><label class="field">CNPJ ou CPF<input v-model="companyForm.identifier" required placeholder="Somente números"></label><button class="btn primary" :disabled="busy">Cadastrar empresa</button></form></section></div>
</div>
